[project]
name = "gtrendscli"
dynamic = ["version"]
description = "CLI for the Google Trends Research / Health Trends API, for journalism and OSINT"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "owahltinez", email = "oscar@wahltinez.org" }]
keywords = [
    "google-trends",
    "trends",
    "search-interest",
    "osint",
    "journalism",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1",
    "urllib3>=2.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
parquet = ["pyarrow>=16"]

[project.scripts]
gtrends = "gtrendscli.cli:main"

[project.urls]
Homepage = "https://github.com/owahltinez/gtrendscli"
Repository = "https://github.com/owahltinez/gtrendscli"
Issues = "https://github.com/owahltinez/gtrendscli/issues"

[dependency-groups]
# pyarrow is an optional runtime extra but a required one for the test suite,
# so a fresh clone gets a green run rather than one skipped test.
dev = ["pytest>=8", "pyarrow>=16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# One source of truth for the version, so `gtrends --version` cannot drift
# from the published package.
[tool.hatch.version]
path = "src/gtrendscli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gtrendscli"]

# The Agent Skill is authored at the repository root, where it is visible, and
# mapped into the package at build time so `gtrends skill install` can find it
# through importlib.resources. Placing it at the wheel's top level instead
# would claim `skills`, a very common name in site-packages.
[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "gtrendscli/skills/gtrends/SKILL.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: hits the real API; requires TRENDS_API_KEY. Run with -m live",
]
