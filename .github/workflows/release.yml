name: Release

# Pushing a vX.Y.Z tag publishes it, with no manual step. The safety is in the
# two checks below rather than in ceremony: the tag must match the packaged
# version, and the built wheel must install and run. PyPI versions are
# immutable, so a wrong upload cannot be corrected, only abandoned.
on:
  push:
    tags: ["v*.*.*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.repository == 'owahltinez/trends-research-cli'

    # Named in PyPI's Trusted Publisher config, so the OIDC exchange fails
    # without it. It carries no protection rules: releases are automatic.
    environment:
      name: pypi
      url: https://pypi.org/p/trends-research-cli

    permissions:
      # Trusted Publishing exchanges this token with PyPI, so there is no API
      # token in repository secrets to leak or rotate.
      id-token: write
      # To create the GitHub Release once the upload has succeeded.
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # release notes are generated from history

      - uses: astral-sh/setup-uv@v9.0.0

      # The version is single-sourced from the package, so a tag that does not
      # match it would publish something other than what the tag claims -- and
      # the wrong number could not then be corrected.
      - name: the tag matches the packaged version
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          packaged="$(uv run --no-project --with . python -c \
            'import importlib.metadata as m; print(m.version("trends-research-cli"))')"
          echo "tag=$tagged packaged=$packaged"
          test "$tagged" = "$packaged"

      - run: uv sync
      - run: uv run pytest -q

      - run: uv build

      # The taxonomy and the skill are bundled data. Losing either passes every
      # unit test and would ship a broken wheel that can never be replaced.
      - name: the built wheel actually works
        run: |
          uv tool install --from dist/*.whl trends-research-cli
          gtrends --version
          gtrends guide > /dev/null
          gtrends categories --show /Health > /dev/null
          gtrends skill install --to "$RUNNER_TEMP/skills"
          test -f "$RUNNER_TEMP/skills/gtrends/SKILL.md"

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

      # Done last, so the Releases page never advertises a version that failed
      # to upload.
      - name: record the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/*
